<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMJK - Filmdetails</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="detail">
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-badge">IMJK</div>
          <nav>
            <a href="/index.html">Entdecken</a>
            <a href="/index.html">Top Filme</a>
            <a href="/add-movie.html">Film hinzufügen</a>
          </nav>
        </div>

        <div class="search-area">
          <input type="text" placeholder="Film, Regisseur, Genre, Schauspieler..." />
          <button>Suche</button>
        </div>

        <div class="user-area">
          <button id="settingsBtn" class="icon-btn" aria-label="Einstellungen">⚙</button>
          <span id="userBadge" class="user-badge hidden">Gast</span>
          <button id="loginBtn" class="primary">Login</button>
          <button id="registerBtn" class="secondary">Registrieren</button>
          <button id="logoutBtn" class="ghost hidden">Abmelden</button>
        </div>
      </header>

      <main class="detail-shell">
        <div class="detail-layout">
          <div id="detailPoster" class="detail-poster"></div>

          <div class="detail-block">
            <h1 id="detailTitle">Film</h1>
            <div class="detail-meta">
              <div class="meta-box"><strong>Bewertung</strong><span id="detailScore">0.0 / 10</span></div>
              <div class="meta-box"><strong>Genre</strong><div id="detailGenres" class="genre-list"></div></div>
              <div class="meta-box"><strong>Regie</strong><span id="detailDirector"></span></div>
            </div>

            <div class="meta-box">
              <strong>Darsteller</strong>
              <span id="detailCast"></span>
            </div>

            <div class="meta-box">
              <strong>Inhalt</strong>
              <p id="detailPlot"></p>
            </div>
          </div>
        </div>

        <section class="review-panel">
          <h2>Bewertungen & Rezensionen</h2>
          <div id="reviewList" class="review-list"></div>
        </section>

        <section class="review-panel">
          <h3>Eigene Bewertung abgeben</h3>
          <form id="ratingForm" class="review-form">
            <div class="star-row">
              <button type="button" class="star-btn" data-value="1">★</button>
              <button type="button" class="star-btn" data-value="2">★</button>
              <button type="button" class="star-btn" data-value="3">★</button>
              <button type="button" class="star-btn" data-value="4">★</button>
              <button type="button" class="star-btn" data-value="5">★</button>
            </div>
            <textarea id="reviewText" rows="4" placeholder="Schreibe deine Rezension..."></textarea>
            <button type="submit" class="primary-btn">Bewertung senden</button>
          </form>
        </section>
      </main>
    </div>

    <div id="loginModal" class="modal hidden">
      <div class="modal-content">
        <h3>Login</h3>
        <form id="loginForm">
          <input id="loginUsername" type="text" placeholder="Benutzername" required />
          <input id="loginPassword" type="password" placeholder="Passwort" required />
          <button type="submit">Einloggen</button>
        </form>
      </div>
    </div>

    <div id="registerModal" class="modal hidden">
      <div class="modal-content">
        <h3>Account erstellen</h3>
        <form id="registerForm">
          <input id="registerUsername" type="text" placeholder="Benutzername" required />
          <input id="registerPassword" type="password" placeholder="Passwort" required />
          <input id="favoriteGenres" type="text" placeholder="Lieblingsgenres, z. B. Sci-Fi,Drama" />
          <button type="submit">Registrieren</button>
        </form>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
