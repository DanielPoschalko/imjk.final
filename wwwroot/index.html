<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMJK - Filmportal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="home">
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-badge">IMJK</div>
          <nav>
            <a href="/index.html">Entdecken</a>
            <a href="/index.html">Top Filme</a>
            <a href="/add-movie.html">Film hinzufügen</a>
          </nav>
        </div>

        <div class="search-wrap">
          <div class="search-area">
            <input id="globalSearch" type="text" placeholder="Film, Regisseur, Genre, Schauspieler..." />
            <button id="searchBtn">Suchen</button>
          </div>
          <div id="searchSuggestions" class="search-suggestions hidden" aria-live="polite"></div>
        </div>

        <div class="user-area">
          <button id="settingsBtn" class="icon-btn" aria-label="Einstellungen">⚙</button>
          <span id="userBadge" class="user-badge hidden">Gast</span>
          <button id="loginBtn" class="primary">Login</button>
          <button id="registerBtn" class="secondary">Registrieren</button>
          <button id="logoutBtn" class="ghost hidden">Abmelden</button>
        </div>
      </header>

      <main class="content">
        <section class="hero card">
          <div class="hero-badges">
            <span class="tag tag-yellow">IMJK Katalog 2025</span>
            <span class="tag tag-light">Live Community</span>
          </div>

          <div class="hero-body">
            <div class="hero-copy">
              <h1>Willkommen bei IMJK</h1>
              <p>Entdecke, bewerte und diskutiere Filme in einer Community mit Stil und Funktion.</p>
            </div>
            <div class="hero-score">
              <span class="star">★</span>
              <strong>9.8</strong>
            </div>
          </div>
        </section>

        <section class="toolbar card">
          <div class="chip-group">
            <button class="chip active" data-genre="">Alle</button>
            <button class="chip" data-genre="Sci-Fi">Sci-Fi</button>
            <button class="chip" data-genre="Drama">Drama</button>
            <button class="chip" data-genre="Thriller">Thriller</button>
            <button class="chip" data-genre="Mystery">Mystery</button>
            <button class="chip" data-genre="Action">Action</button>
          </div>
        </section>

        <section class="section-header">
          <div>
            <span class="section-label">IMJK KATALOG</span>
            <h2>Für dich empfohlen</h2>
          </div>
          <div class="sortbox">
            <label for="sortSelect">Sortierung</label>
            <select id="sortSelect">
              <option value="rating">Bewertung</option>
              <option value="year">Jahr</option>
            </select>
          </div>
        </section>

        <section id="movieGrid" class="movie-grid"></section>
      </main>
    </div>

    <div id="loginModal" class="modal hidden">
      <div class="modal-content">
        <h3>Login</h3>
        <form id="loginForm">
          <input id="loginUsername" type="text" placeholder="Benutzername" required />
          <input id="loginPassword" type="password" placeholder="Passwort" required />
          <button type="submit">Einloggen</button>
        </form>
      </div>
    </div>

    <div id="registerModal" class="modal hidden">
      <div class="modal-content">
        <h3>Account erstellen</h3>
        <form id="registerForm">
          <input id="registerUsername" type="text" placeholder="Benutzername" required />
          <input id="registerPassword" type="password" placeholder="Passwort" required />
          <input id="favoriteGenres" type="text" placeholder="Lieblingsgenres, z. B. Sci-Fi,Drama" />
          <button type="submit">Registrieren</button>
        </form>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
